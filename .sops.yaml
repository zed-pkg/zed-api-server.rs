# SOPS creation rules for zed-api-server.rs environment secrets
# (zed-pkg org convention — see zed-pkg/zed-infra PR #10).
#
# Only ciphertext is ever committed. Plaintext lives in `env/dec/`, which is
# gitignored, and at the repo-root `.env` symlink, which is also gitignored.
#
# Format note: for `dotenv` files SOPS encrypts *values* only. Variable NAMES
# stay readable in `env/enc/*.env.enc`, which is intentional — the encrypted
# file doubles as the reviewable schema for each environment, so a PR diff
# shows that a variable was added without leaking what it was set to.
#
# Adding a recipient (new machine, new operator, CI):
#   1. On the new host: `just age-key` prints its public key.
#   2. Add that `age1...` key to the matching `age:` list below.
#   3. From a host that can already decrypt: `sops updatekeys env/enc/<name>.env.enc`.
#   4. Commit the re-encrypted `env/enc/*.env.enc`.
#
# Removing a recipient is the same flow minus the key, but treat every secret
# that key could read as compromised and rotate it at the provider.

keys:
  # Operator keys. Keep one entry per human/machine, commented with its owner.
  - &op_alex_macbook age1s8lcnaxn9g77s6j4g7p24w6sgvllpue0lzrsvp3xk02k2gwjj5ssnkp39q

creation_rules:
  # Production carries the registry DATABASE_URL, the R2 key pair, and the
  # tag-verification GitHub token — narrowest recipient set.
  - path_regex: ^env/enc/prod\.env\.enc$
    key_groups:
      - age:
          - *op_alex_macbook

  # Staging and dev. Same mechanism; widen the recipient list here first when
  # onboarding someone, before granting prod.
  - path_regex: ^env/enc/(staging|dev)\.env\.enc$
    key_groups:
      - age:
          - *op_alex_macbook

  # Catch-all so a new `env/enc/*.env.enc` can never be written unencrypted by
  # accident. Anything not matched above still gets encrypted to the operator
  # set rather than falling through to plaintext.
  - path_regex: ^env/enc/.*\.env\.enc$
    key_groups:
      - age:
          - *op_alex_macbook
