# dd-zed-api-server — the zed-pkg registry REST API (axum + sea-orm, artifacts in R2).
#
# Layer-2 (app-owned) manifest: namespace-scoped ONLY. The `zed` Namespace, its
# ResourceQuota/LimitRange and the default-deny NetworkPolicy are Layer-1, owned by
# ORESoftware/k8s-cluster (remote/argocd/projects/zed.tenant.yaml). Do NOT add a
# Namespace/ClusterRole/CRD here — the `zed` AppProject enforces
# clusterResourceWhitelist: [] and the sync will fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-zed-api-server
  namespace: zed
  labels:
    app: dd-zed-api-server
    app.kubernetes.io/name: dd-zed-api-server
    app.kubernetes.io/part-of: zed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dd-zed-api-server
  template:
    metadata:
      labels:
        app: dd-zed-api-server
        app.kubernetes.io/name: dd-zed-api-server
        app.kubernetes.io/part-of: zed
    spec:
      # Talks to Postgres and R2 over egress; never calls the k8s API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: zed-api-server
          # `main` is a MUTABLE tag. With IfNotPresent a node that already
          # cached some older `main` never re-pulls, so replicas can silently
          # serve different builds and a rollout is not reproducible. `Always`
          # makes every pod start converge on the current `main`.
          # The real fix is pinning by digest in the GitOps overlay
          # (zed-infra/k8s/manifests/zed-api-server/overlays/prod) so the
          # deployed revision is declared, reviewable, and rollback-able.
          image: ghcr.io/zed-pkg/zed-api-server:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: BIND_ADDR, value: "0.0.0.0:8080" }
            - { name: PUBLIC_BASE_URL, value: "https://registry.zpkg.tech" }
            - { name: STORAGE_BACKEND, value: "s3" }
            - { name: S3_BUCKET, value: "zed-pkg-artifacts" }
            # Cloudflare R2; account-scoped endpoint comes from zed-infra
            # terraform/cloudflare outputs. Not a secret — the credentials are.
            - { name: S3_ENDPOINT_URL, value: "https://REPLACE-ME-account-id.r2.cloudflarestorage.com" }
            - { name: S3_REGION, value: "auto" }
            - { name: S3_FORCE_PATH_STYLE, value: "true" }
            - { name: ZED_VERIFY_TAGS, value: "github" }
            # Migrations run out-of-band (or by first replica); keeping this off
            # avoids two replicas racing the migrator at rollout.
            - { name: AUTO_MIGRATE, value: "false" }
            - { name: MAX_ARTIFACT_BYTES, value: "104857600" }
            - { name: RUST_LOG, value: "info" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: dd-zed-api-secrets, key: ZED_API_DATABASE_URL }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: dd-zed-api-secrets, key: ZED_R2_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: dd-zed-api-secrets, key: ZED_R2_SECRET_ACCESS_KEY }
          # A DB/R2 blip should take the pod out of the Service, not restart it.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          lifecycle:
            preStop:
              # Let endpoint removal propagate before shutdown so in-flight
              # publishes are not cut off.
              exec: { command: ["sleep", "5"] }
      volumes:
        - name: tmp
          emptyDir: {}
