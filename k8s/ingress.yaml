# STAGED, NOT APPLIED: deliberately absent from every kustomization (see
# k8s/base/kustomization.yaml — bootstrap runs with auth/rate-limit/tag
# verification disabled, so a public Ingress is gated on the DEN-534/DEN-535
# promotion). Kept here so the public shape is reviewed ahead of time.
#
# api.zpkg.net serves the complete API. registry.zpkg.net reaches the same
# process, but `registry_host` rejects every route/method outside the explicit
# machine-registry state table before handler work. Cloudflare enforces the
# same table at the edge; the in-process guard prevents direct-origin bypass.
# DNS lives in zed-infra/terraform/cloudflare; records stay DNS-only until
# cert-manager issues this certificate (ACME HTTP-01 ordering).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-zed-api-server
  namespace: zed
  labels:
    app: dd-zed-api-server
    app.kubernetes.io/part-of: zed
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # The app can identify authenticated credentials but, behind ingress-nginx,
    # it cannot safely treat the upstream socket address as the original client.
    # Keep an ingress-owned IP abuse ceiling for anonymous/read traffic as a
    # separate layer from the application's per-token limiter.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # Keep slow clients from retaining ingress/upstream resources indefinitely.
    # These remain above the application's 30-second request timeout so normal
    # application timeout/error behavior wins before the proxy gives up.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "110m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.zpkg.net, registry.zpkg.net]
      secretName: zed-api-server-tls
  rules:
    - host: api.zpkg.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-zed-api-server
                port:
                  number: 8080
    - host: registry.zpkg.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-zed-api-server
                port:
                  number: 8080
