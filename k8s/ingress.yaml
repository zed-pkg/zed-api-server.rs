# STAGED, NOT APPLIED: deliberately absent from every kustomization (see
# k8s/base/kustomization.yaml). Bootstrap runs with auth, rate-limit, and tag
# verification disabled, so a public Ingress remains gated on the DEN-534 and
# DEN-535 promotion work.
#
# api.zpkg.net and registry.zpkg.net both serve the API root today. When the
# registry moves to a sub-path of the API server, the registry.zpkg.net rule
# gains the path prefix (or an edge rewrite); DNS stays the same. DNS lives in
# zed-infra/terraform/cloudflare, and records stay DNS-only until cert-manager
# issues this certificate via ACME HTTP-01.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-zed-api-server
  namespace: zed
  labels:
    app: dd-zed-api-server
    app.kubernetes.io/part-of: zed
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Publishes streaming tarballs up to MAX_ARTIFACT_BYTES (100 MiB).
    nginx.ingress.kubernetes.io/proxy-body-size: "110m"
    # nginx sees the real client address and therefore owns anonymous per-IP
    # protection. The application separately enforces per-token limits.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # Sit above the application's 30-second request timeout so its response
    # normally wins while still bounding slow upstream connections.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.zpkg.net, registry.zpkg.net]
      secretName: zed-api-server-tls
  rules:
    - host: api.zpkg.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-zed-api-server
                port:
                  number: 8080
    - host: registry.zpkg.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-zed-api-server
                port:
                  number: 8080
