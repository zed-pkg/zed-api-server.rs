apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zed

# Bootstrap is intentionally cluster-local. The API runs with authentication,
# rate limiting, and tag verification disabled while package interoperability is
# certified, so a public Ingress would turn those temporary bypasses into an
# unauthenticated Internet-facing publication service. Public exposure is a
# separate promotion step after auth is restored.
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
