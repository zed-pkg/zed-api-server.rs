# Re-opens exactly what the cluster-local bootstrap API needs on top of the
# tenant's default-deny policy. While authentication and rate limiting are
# disabled, ingress-nginx is intentionally absent. Public promotion must
# replace this policy. HTTPS egress is open: the s3 storage backend uploads
# to and presigns against Cloudflare R2, and ZED_VERIFY_TAGS=github calls
# api.github.com — with only DNS+postgres egress every publish times out in
# put_object and surfaces as a bare 500 (verified live 2026-08-08).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-zed-api-server
  namespace: zed
spec:
  podSelector:
    matchLabels:
      app: dd-zed-api-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: zed
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app: zed-postgres
      ports:
        - { protocol: TCP, port: 5432 }
