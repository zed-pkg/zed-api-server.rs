apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The Hetzner bootstrap remains cluster-local while auth/rate/tag checks are
# disabled. Public ingress is promoted separately after authentication and
# certificate policy are enabled.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: dd-zed-api-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dd-zed-api-server
      spec:
        template:
          spec:
            containers:
              - name: zed-api-server
                env:
                  - name: PUBLIC_BASE_URL
                    value: https://registry.hetzner.zpkg.tech
