[package]
name = "zed-api-server"
version = "0.1.0"
edition = "2024"
description = "zed-pkg registry REST API: Postgres metadata, S3/R2 artifacts"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-api-server.rs"

[workspace]
members = [".", "migration"]

[dependencies]
# Keep every cross-repository boundary immutable and independently reviewable.
# This revision includes the account/audit and dependency-graph contracts, the
# additive graph export route/media contract (zed-interfaces#63), and the
# target-qualified binary artifact v1 DTOs and portable path validation
# (zed-interfaces#64). The repository root remains a Cargo workspace, so git
# consumers resolve its Rust package without a path override.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "4b87e425b04777b0ee413971dc1df805d24f295f" }
# Canonical account, registry projection, and migration data plane. The API is
# the only long-running service that opts into write symbols; the discrete
# `migrate` command is the only runtime path that invokes DDL.
zed-orm-core = { git = "https://github.com/zed-pkg/zed-lib-core.git", rev = "fc4f2677a2315d522913bef05a1c0d23f8208960", features = ["read-write", "migrate"] }
# The private shared-auth-clients repository cannot be cloned by this
# repository's scoped GITHUB_TOKEN. `src/shared_auth.rs` implements the small,
# reviewed exchange/introspection HTTP contract using the existing reqwest
# dependency; it is pinned in comments/tests to shared-auth-clients commit
# 1b1089123394ac4006901cdac477d63bfba48943.
#
# The local migration crate remains only for the legacy `/v1` compatibility
# tables. The canonical `zed_*` contract and migrations are owned exclusively by
# zed-orm-core and the pinned shared-definitions SQL segment.
migration = { path = "migration" }
anyhow = "1"
# Distributed locks/leases (fiducia.cloud). Blocking (ureq) client — call it
# via spawn_blocking from async handlers. See routes/orgs.rs.
fiducia-client = { git = "https://github.com/fiducia-cloud/fiducia-clients.git" }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["multipart"] }
# Bytes flows from the multipart reader into storage without a re-copy.
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
flate2 = "1"
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
# ReaderStream, so artifact downloads stream from disk instead of buffering.
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Read-side only; deflate decoding reuses the flate2 backend already in-tree.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Independent parsers for the YAML/TOML representations this service emits.
# Test-only on purpose: the emitters are hand-written because the contract
# constrains the output past what a general serializer guarantees (safe YAML
# subset, normalized TOML, absent optionals omitted), so round-trip tests have
# to be judged by a third-party parser rather than by the same code that wrote
# the bytes.
serde_yaml = "0.9"
toml = "0.9"
# SQLite is pulled in only for tests (dev-dependencies are excluded from
# `cargo build --release`), giving publish/claim handlers a real in-memory
# database to exercise transaction/immutability behavior against.
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
