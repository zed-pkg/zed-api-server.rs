schemaVersion = "ores.rate-limit.config.v1"
layout = "server-only"
defaultPolicyId = "authenticated-default"

[server]
root = "."
backend = "redis"
enforcementLayer = "service"
redisUrlEnv = "REDIS_URL"
keyHmacEnv = "ORES_RL_HMAC_KEY"

[[env]]
key = "ORES_RL_HMAC_KEY"
kind = "string"
required = true
secret = true
purpose = "HMAC key used to derive opaque package-token rate-limit identities"

[[env]]
key = "REDIS_URL"
kind = "url"
required = true
secret = true
purpose = "Redis connection URL for authoritative distributed rate-limit state"

[[policies]]
policyId = "authenticated-default"
clientVisible = false
algorithm = "token-bucket"
identityScope = "authenticated-subject"
capacity = 600
windowMs = 0
refillTokens = 600
refillIntervalMs = 60000
requestCost = 1
enforcementMode = "enforce"
consistencyMode = "strict"
backendFailureMode = "fail-closed"
denyCacheMode = "local-denials"
denyCacheCapacity = 0
maxOvershoot = 0
maxBlockTtlMs = 60000
keyVersion = "v1"
policyVersion = 1
