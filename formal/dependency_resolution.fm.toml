# Third schema-v1 fmctl model for DEN-99. This isolates deterministic dependency
# resolution and lockfile safety from publication finalization and latest-version
# selection while retaining the same pinned runner and verifier contract.
schema_version = 1
project = "zed-api-server"
model = "dependency-resolution"
language = "quint"
spec = "formal/dependency_resolution.qnt"
main = "dependency_resolution"
init = "init"
step = "step"
invariants = ["resolution_safety"]
witnesses = [
  "highest_solution_reached",
  "yank_fallback_reached",
  "mirror_lag_failure_reached",
  "missing_dependency_reached",
  "cycle_failure_reached",
  "idempotent_replay_reached",
]

[toolchain]
quint = "0.32.0"
java = ">=17"
node = "22"
npx = "npx"

[execution]
timeout_seconds = 600
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts/dependency-resolution"

[simulation]
backend = "typescript"
max_samples = 10000
max_steps = 14

[verification]
backend = "tlc"
exhaustive_finite_model = true
