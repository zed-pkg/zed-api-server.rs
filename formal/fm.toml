# Schema-v1 manifest consumed by the incubating fmctl implementation tracked in
# Linear DEN-580. The model is repository-owned; fmctl supplies deterministic
# discovery, bounded execution, normalized artifacts, and CI exit contracts.
schema_version = 1
project = "zed-api-server"
model = "package-publication"
language = "quint"
spec = "formal/package_publication.qnt"
main = "package_publication"
init = "init"
step = "step"
invariants = ["publication_safety"]
witnesses = [
  "crash_after_upload_reached",
  "competing_publish_reached",
  "abort_after_upload_reached",
  "unauthorized_rejection_reached",
  "same_digest_race_reached",
]

[toolchain]
quint = "0.32.0"
java = ">=17"
node = "22"
npx = "npx"

[execution]
timeout_seconds = 600
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts"

[simulation]
backend = "typescript"
max_samples = 5000
max_steps = 16

[verification]
backend = "tlc"
exhaustive_finite_model = true
