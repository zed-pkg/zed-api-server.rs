name: One-shot public intake identifier repair

on:
  push:
    branches:
      - fix/public-intake-test-identifier-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/public-intake-test-identifier-20260915
          fetch-depth: 0

      - name: Repair independent baseline parser defects
        shell: bash
        run: |
          set -euo pipefail
          runtime_old='fn public_response_shapes cannot_reflect_submitted_identity()'
          runtime_new='fn public_response_shapes_cannot_reflect_submitted_identity()'
          materialized_old='fn common_field_inventory_is a subset of every request shape()'
          materialized_new='fn common_field_inventory_is_a_subset_of_every_request_shape()'

          if grep -Fq "$runtime_new" src/public_intake.rs \
            && grep -Fq "$materialized_new" .github/materialize/public_intake.rs \
            && ! grep -Fq "$runtime_old" src/public_intake.rs \
            && ! grep -Fq "$materialized_old" .github/materialize/public_intake.rs; then
            echo 'parser repairs already present on branch; no-op'
            exit 0
          fi

          git fetch --no-tags origin main
          git show origin/main:src/public_intake.rs > src/public_intake.rs
          git show origin/main:.github/materialize/public_intake.rs > .github/materialize/public_intake.rs

          test "$(grep -Foc "$runtime_old" src/public_intake.rs || true)" -eq 1
          test "$(grep -Foc "$materialized_old" .github/materialize/public_intake.rs || true)" -eq 1
          perl -0pi -e 's/fn public_response_shapes cannot_reflect_submitted_identity\(\)/fn public_response_shapes_cannot_reflect_submitted_identity()/g' src/public_intake.rs
          perl -0pi -e 's/fn common_field_inventory_is a subset of every request shape\(\)/fn common_field_inventory_is_a_subset_of_every_request_shape()/g' .github/materialize/public_intake.rs

          test "$(grep -Foc "$runtime_new" src/public_intake.rs || true)" -eq 1
          test "$(grep -Foc "$materialized_new" .github/materialize/public_intake.rs || true)" -eq 1
          test "$(grep -Foc "$runtime_old" src/public_intake.rs || true)" -eq 0
          test "$(grep -Foc "$materialized_old" .github/materialize/public_intake.rs || true)" -eq 0

          rustfmt --edition 2024 --emit stdout src/public_intake.rs >/dev/null
          rustfmt --edition 2024 --emit stdout .github/materialize/public_intake.rs >/dev/null
          git diff origin/main --check -- src/public_intake.rs .github/materialize/public_intake.rs

          src_stats="$(git diff --numstat origin/main -- src/public_intake.rs)"
          mat_stats="$(git diff --numstat origin/main -- .github/materialize/public_intake.rs)"
          printf 'runtime diff: %s\nmaterialized diff: %s\n' "$src_stats" "$mat_stats"
          test "$(printf '%s\n' "$src_stats" | awk '{print $1}')" -eq 1
          test "$(printf '%s\n' "$src_stats" | awk '{print $2}')" -eq 1
          test "$(printf '%s\n' "$mat_stats" | awk '{print $1}')" -eq 1
          test "$(printf '%s\n' "$mat_stats" | awk '{print $2}')" -eq 1

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/public_intake.rs .github/materialize/public_intake.rs
          git diff --cached --check
          git commit -m 'fix: repair public intake test identifiers'
          git push origin HEAD:fix/public-intake-test-identifier-20260915
