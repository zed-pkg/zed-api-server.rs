name: One-shot public intake identifier repair

on:
  push:
    branches:
      - fix/public-intake-test-identifier-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/public-intake-test-identifier-20260915
          fetch-depth: 0

      - name: Diagnose baseline parser defects independently
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:src/public_intake.rs > "$RUNNER_TEMP/src-public-intake.rs"
          git show origin/main:.github/materialize/public_intake.rs > "$RUNNER_TEMP/materialized-public-intake.rs"

          echo '=== suspicious function declarations: runtime ==='
          grep -nE '^[[:space:]]*(pub(\([^)]*\))?[[:space:]]+)?(async[[:space:]]+)?fn[[:space:]]+[A-Za-z0-9_]+[[:space:]]+[A-Za-z0-9_]+[[:space:]]*\(' "$RUNNER_TEMP/src-public-intake.rs" || true
          echo '=== suspicious function declarations: materialized ==='
          grep -nE '^[[:space:]]*(pub(\([^)]*\))?[[:space:]]+)?(async[[:space:]]+)?fn[[:space:]]+[A-Za-z0-9_]+[[:space:]]+[A-Za-z0-9_]+[[:space:]]*\(' "$RUNNER_TEMP/materialized-public-intake.rs" || true

          echo '=== rustfmt parse: runtime ==='
          rustfmt --edition 2024 --check "$RUNNER_TEMP/src-public-intake.rs" || true
          echo '=== rustfmt parse: materialized ==='
          rustfmt --edition 2024 --check "$RUNNER_TEMP/materialized-public-intake.rs" || true

          old='fn public_response_shapes cannot_reflect_submitted_identity()'
          test "$(grep -Foc "$old" "$RUNNER_TEMP/src-public-intake.rs" || true)" -eq 1

      - name: Stop after diagnostics
        shell: bash
        run: |
          echo 'diagnostics complete; no repository source files were changed'
