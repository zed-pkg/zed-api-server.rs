name: audit binary interface revision pins

on:
  push:
    branches:
      - agent/verify-binary-uploads

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/verify-binary-uploads
          persist-credentials: false
      - name: Report stale interface revision pins
        shell: bash
        env:
          OLD_REV: 30d739167036f54b7919c5776c453123f206ca3c
        run: |
          set -euo pipefail
          matches="$(grep -RIl "$OLD_REV" .github/workflows \
            --exclude=agent-verify-binary-uploads.yml | sort || true)"
          if [[ -z "$matches" ]]; then
            echo "STALE_INTERFACE_PIN_FILES=none"
          else
            echo "STALE_INTERFACE_PIN_FILES<<EOF"
            printf '%s\n' "$matches"
            echo "EOF"
          fi
