name: Refresh ores-middleware lock (one-shot)

on:
  push:
    branches:
      - fix/ores-middleware-csp-backport

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ores-middleware-csp-backport
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh only the ores-middleware lock resolution
        run: cargo update -p ores-middleware
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already matches Cargo.toml'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: refresh ores-middleware lock pin'
          git push origin HEAD:fix/ores-middleware-csp-backport
