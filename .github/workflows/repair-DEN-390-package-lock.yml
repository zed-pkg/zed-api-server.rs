name: one-shot DEN-390 package lock repair

on:
  push:
    branches:
      - fix/DEN-390-package-version-parity-20260910
    paths:
      - '.github/workflows/repair-DEN-390-package-lock.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Repair only the root package lock version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          cargo = tomllib.loads(Path('Cargo.toml').read_text())
          zpkg = tomllib.loads(Path('.zpkg.toml').read_text())
          assert cargo['package']['name'] == 'zed-api-server'
          assert cargo['package']['version'] == '0.1.1'
          assert zpkg['package']['name'] == 'zed-api-server'
          assert zpkg['package']['version'] == '0.1.1'

          path = Path('Cargo.lock')
          text = path.read_text()
          old = '[[package]]\nname = "zed-api-server"\nversion = "0.1.0"\n'
          new = '[[package]]\nname = "zed-api-server"\nversion = "0.1.1"\n'
          assert text.count(old) == 1, 'expected exactly one stale root package stanza'
          assert text.count(new) == 0, 'lock already contains repaired root package stanza'
          path.write_text(text.replace(old, new, 1))

          lock = tomllib.loads(path.read_text())
          roots = [p for p in lock['package'] if p['name'] == 'zed-api-server']
          assert len(roots) == 1
          assert roots[0]['version'] == cargo['package']['version'] == zpkg['package']['version']
          PY
          git diff --check -- Cargo.lock
          git diff -- Cargo.lock

      - name: Remove one-shot repair lane and push the reviewed result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/repair-DEN-390-package-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/repair-DEN-390-package-lock.yml
          git diff --cached --check
          git commit -m 'fix(DEN-390): align root Cargo.lock package version'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
            push origin HEAD:fix/DEN-390-package-version-parity-20260910
