name: publish container

on:
  push:
    branches: [main]
    paths:
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'proto/**'
      - 'migration/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish-container.yml'
  pull_request:
    paths:
      - '.zpkg.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'proto/**'
      - 'migration/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The image tag names the API commit. Pin every cross-repository source too so
  # that tag always identifies the complete source graph used by the build.
  # Keep these synchronized with the Rust CI pins; source-graph drift previously
  # made the debug test build pass while the release container could not compile.
  ZED_INTERFACES_SHA: 7d31f80dd8a310f218931165a3ad636a2f32b932
  ZED_LIB_CORE_SHA: c3d486a1519381276fbec02aa25247f542924443

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # Migration m20260726_000007_embeddings_and_tags creates the vector
        # extension. A plain postgres image cannot satisfy that production
        # schema, so test the container against the exact bootstrap capability.
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:84a355869251af1a3379cfc9fa7b4dbf962c03f642a4bb7b339a203925071c43
        env:
          POSTGRES_USER: zed
          POSTGRES_DB: zed
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zed -d zed"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout API source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-api-server.rs
          persist-credentials: false

      - name: Checkout pinned shared interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false

      - name: Checkout pinned canonical ORM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-lib-core
          ref: ${{ env.ZED_LIB_CORE_SHA }}
          path: zed-lib-core
          persist-credentials: false

      - name: Verify the complete source graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-api-server.rs rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_SHA"
          test "$(git -C zed-lib-core rev-parse HEAD)" = "$ZED_LIB_CORE_SHA"
          test "$(sed -n 's/^  ZED_INTERFACES_SHA: //p' zed-api-server.rs/.github/workflows/ci.yml)" = "$ZED_INTERFACES_SHA"
          test "$(sed -n 's/^  ZED_LIB_CORE_SHA: //p' zed-api-server.rs/.github/workflows/ci.yml)" = "$ZED_LIB_CORE_SHA"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          root = Path("zed-api-server.rs")
          manifest = tomllib.loads((root / "Cargo.toml").read_text())
          lock = tomllib.loads((root / "Cargo.lock").read_text())
          pins = {
              "zed-interfaces": (
                  "https://github.com/zed-pkg/zed-interfaces.git",
                  os.environ["ZED_INTERFACES_SHA"],
              ),
              "zed-orm-core": (
                  "https://github.com/zed-pkg/zed-lib-core.git",
                  os.environ["ZED_LIB_CORE_SHA"],
              ),
          }

          for package, (repository, revision) in pins.items():
              spec = manifest["dependencies"][package]
              assert "path" not in spec, spec
              assert spec["git"] == repository, spec
              assert spec["rev"] == revision, spec
              expected_source = f"git+{repository}?rev={revision}#{revision}"
              matches = [
                  entry for entry in lock["package"]
                  if entry["name"] == package and entry.get("source") == expected_source
              ]
              assert len(matches) == 1, (
                  f"Cargo.lock does not uniquely pin {package} to {expected_source}"
              )
          PY

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the exact deployable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: zed-api-server.rs/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            ZED_API_REVISION=${{ github.sha }}
            ZED_INTERFACES_REVISION=${{ env.ZED_INTERFACES_SHA }}
            ZED_LIB_CORE_REVISION=${{ env.ZED_LIB_CORE_SHA }}
          tags: |
            ghcr.io/zed-pkg/zed-api-server:${{ github.sha }}
            ghcr.io/zed-pkg/zed-api-server:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify embedded image provenance
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/zed-pkg/zed-api-server:${GITHUB_SHA}"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.zpkg.interfaces.revision" }}')" = "$ZED_INTERFACES_SHA"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.zpkg.lib-core.revision" }}')" = "$ZED_LIB_CORE_SHA"

      - name: Start the API image against Postgres and bounded process memory
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name zed-api-smoke --network host \
            -e BIND_ADDR=127.0.0.1:48080 \
            -e DATABASE_URL=postgres://zed@127.0.0.1:5432/zed \
            -e AUTO_MIGRATE=true \
            -e STORAGE_BACKEND=memory \
            -e STORAGE_MEMORY_MAX_BYTES=268435456 \
            -e PUBLIC_BASE_URL=http://127.0.0.1:48080 \
            -e ZED_REGISTRY_ID=registry:zpkg-container-smoke \
            -e ZED_AUTH_DISABLED=1 \
            -e ZED_RATE_LIMIT_DISABLED=1 \
            -e ZED_VERIFY_TAGS=off \
            "ghcr.io/zed-pkg/zed-api-server:${GITHUB_SHA}"

      - name: Wait for migrations, process-memory storage, and health
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if ! docker ps --format '{{.Names}}' | grep -qx zed-api-smoke; then
              echo 'registry container exited before becoming healthy' >&2
              exit 1
            fi
            if curl -fsS http://127.0.0.1:48080/healthz; then
              docker inspect zed-api-smoke --format '{{range .Config.Env}}{{println .}}{{end}}' \
                | grep -qx 'STORAGE_BACKEND=memory'
              docker inspect zed-api-smoke --format '{{range .Config.Env}}{{println .}}{{end}}' \
                | grep -qx 'STORAGE_MEMORY_MAX_BYTES=268435456'
              return_code=0
              exit "$return_code"
            fi
            sleep 2
          done
          echo 'registry image never became healthy' >&2
          exit 1

      - name: Capture API smoke and provenance diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p smoke-diagnostics
          docker logs zed-api-smoke > smoke-diagnostics/container.log 2>&1
          docker inspect zed-api-smoke > smoke-diagnostics/container-inspect.json 2>&1
          docker image inspect "ghcr.io/zed-pkg/zed-api-server:${GITHUB_SHA}" \
            > smoke-diagnostics/image-inspect.json 2>&1
          docker ps -a > smoke-diagnostics/docker-ps.txt 2>&1
          printf 'api_revision=%s\ninterfaces_revision=%s\nlib_core_revision=%s\nstorage_backend=memory\n' \
            "$GITHUB_SHA" "$ZED_INTERFACES_SHA" "$ZED_LIB_CORE_SHA" \
            > smoke-diagnostics/source-revisions.txt
          sed -n '1,240p' smoke-diagnostics/container.log

      - name: Remove API smoke container
        if: always()
        run: docker rm -f zed-api-smoke >/dev/null 2>&1 || true

      - name: Push immutable and compatibility tags
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-diagnostics
          immutable="ghcr.io/zed-pkg/zed-api-server:${GITHUB_SHA}"
          immutable_log="smoke-diagnostics/immutable-push.log"
          compatibility_log="smoke-diagnostics/main-push.log"

          # Docker may write progress and the final digest to stderr. Preserve
          # the complete stream while retaining pipefail so a denied/failed push
          # cannot be mistaken for successful evidence collection.
          docker push "$immutable" 2>&1 | tee "$immutable_log"
          digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$immutable_log" | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'could not recover a strict sha256 digest from the immutable push' >&2
            exit 1
          }

          docker push ghcr.io/zed-pkg/zed-api-server:main 2>&1 | tee "$compatibility_log"
          printf 'image=%s@%s\napi_revision=%s\ninterfaces_revision=%s\nlib_core_revision=%s\n' \
            'ghcr.io/zed-pkg/zed-api-server' "$digest" "$GITHUB_SHA" "$ZED_INTERFACES_SHA" "$ZED_LIB_CORE_SHA" \
            > smoke-diagnostics/published-image.txt

      - name: Upload API smoke and provenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zed-api-container-smoke
          path: smoke-diagnostics/
          if-no-files-found: error
          retention-days: 30
