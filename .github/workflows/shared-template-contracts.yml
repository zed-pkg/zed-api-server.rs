name: shared template contracts
on:
  pull_request:
    paths: ['.ores-*.toml','.shared-auth.toml','.ores-config-authorities.json','config/ores-middleware-stack.json','template-shared/**','.github/workflows/shared-template-contracts.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with: { toolchain: 1.88.0 }
      - run: cargo test --manifest-path template-shared/Cargo.toml
      - shell: python
        run: |
          import json,pathlib,tomllib
          r=pathlib.Path('.')
          lock=json.loads((r/'.ores-config-authorities.json').read_text()); assert lock['schemaVersion']==1
          assert (r/'.shared-auth.toml').is_file() and not (r/'.auth-shared.toml').exists()
          for n in ('middleware','rateLimit','lru','sharedAuth','tjsv'):
              rev=lock['authorities'][n]['revision']; assert len(rev)==40 and all(c in '0123456789abcdef' for c in rev)
          for p in ('.ores-mw.toml','.ores-rl.toml','.ores-lru.toml','.shared-auth.toml'): tomllib.loads((r/p).read_text())
          assert json.loads((r/'config/ores-middleware-stack.json').read_text())['contractVersion']=='1.0.0'
