name: update account console lock

on:
  push:
    branches:
      - feat/den-2955-account-console-api
    paths:
      - Cargo.toml
      - .github/workflows/update-account-console-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-account-console-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    if: github.repository == 'zed-pkg/zed-api-server.rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Resolve and commit Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: pin zed-lib registry data plane'
          git push origin HEAD:${GITHUB_REF_NAME}
