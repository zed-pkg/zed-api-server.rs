name: Zed contract parity

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .zpkg.toml
      - .cli-flags.toml
      - .github/workflows/zed-contract-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false

      - name: Verify exact reviewed head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Cross-check Cargo, Zed package, and flags2env contracts
        id: contracts
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          zpkg = tomllib.loads(Path(".zpkg.toml").read_text())
          cli = tomllib.loads(Path(".cli-flags.toml").read_text())

          package = cargo["package"]
          zed = zpkg["package"]
          repo = zed["repository"]["url"].removesuffix(".git").rstrip("/")
          cargo_repo = package["repository"].removesuffix(".git").rstrip("/")

          # Cargo and the Zed registry have independent release histories. In
          # particular, Zed v0.1.1 was created to preserve the immutable legacy
          # v0.1.0 coordinate, so do not force its version to equal Cargo's.
          assert zed["org"] == "zed-pkg", zed
          assert zed["name"] == package["name"], (zed["name"], package["name"])
          assert repo == cargo_repo, (repo, cargo_repo)
          assert re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z.+_-]{0,127}", zed["version"]), zed["version"]

          root_packages = [
              entry
              for entry in lock["package"]
              if entry["name"] == package["name"] and "source" not in entry
          ]
          assert len(root_packages) == 1, root_packages
          assert root_packages[0]["version"] == package["version"], (
              root_packages[0]["version"],
              package["version"],
          )

          # A committed lockfile makes a floating Git dependency reproducible
          # only until the next resolution. Require the manifest itself to pin
          # every direct Git boundary, and prove Cargo.lock resolved that same
          # repository/revision pair.
          lock_sources = [
              entry.get("source", "")
              for entry in lock["package"]
              if entry.get("source", "").startswith("git+")
          ]

          dependency_tables = []
          for section in ("dependencies", "dev-dependencies", "build-dependencies"):
              dependency_tables.append((section, cargo.get(section, {})))
          for target_name, target in cargo.get("target", {}).items():
              for section in ("dependencies", "dev-dependencies", "build-dependencies"):
                  dependency_tables.append(
                      (f"target.{target_name}.{section}", target.get(section, {}))
                  )

          for section, dependencies in dependency_tables:
              for dependency_name, definition in dependencies.items():
                  if not isinstance(definition, dict) or "git" not in definition:
                      continue
                  revision = definition.get("rev")
                  assert isinstance(revision, str) and re.fullmatch(
                      r"[0-9a-f]{40}", revision
                  ), f"{section}.{dependency_name} must pin git with an immutable 40-char rev"
                  dependency_repo = definition["git"].removesuffix(".git").rstrip("/")
                  assert any(
                      dependency_repo in source and source.endswith(f"#{revision}")
                      for source in lock_sources
                  ), (
                      f"Cargo.lock does not resolve {section}.{dependency_name} "
                      f"at {dependency_repo}@{revision}"
                  )

          flags2env = cargo["dependencies"]["flags2env"]
          assert flags2env["git"].removesuffix(".git").rstrip("/") == (
              "https://github.com/flags-2-env/flags-2-env"
          )

          assert cli["identity"]["service"] == package["name"]
          assert cli["parse"]["allow_unknown"] is False

          env_owners = {}
          for name, definition in cli["flags"].items():
              env = definition["env"]
              value_type = definition["type"]
              assert env and isinstance(env, str), name
              assert value_type in {"string", "boolean", "integer"}, (name, value_type)
              previous = env_owners.setdefault(env, name)
              assert previous == name, (env, previous, name)
              if "long" in definition:
                  assert definition["long"] == name.replace('_', '-'), (
                      name,
                      definition["long"],
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"flags2env_rev={flags2env['rev']}", file=output)

          print(
              f"admitted Cargo {package['name']}@{package['version']} / "
              f"Zed {zed['org']}/{zed['name']}@{zed['version']} with "
              f"{len(env_owners)} unique CLI env bindings"
          )

      - name: Check out exact Cargo-pinned flags2env
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: flags-2-env/flags-2-env
          ref: ${{ steps.contracts.outputs.flags2env_rev }}
          persist-credentials: false
          path: flags2env

      - name: Build exact Cargo-pinned native parser
        working-directory: flags2env
        run: make all

      - name: Audit repository CLI contract with exact native parser
        run: flags2env/build/flags2env audit .cli-flags.toml

      - name: Prove native audit did not mutate source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          # `make all` refreshes tracked compatibility outputs under build/;
          # the native audit must leave parser source/config untouched.
          git -C flags2env diff --exit-code HEAD -- . ':(exclude)build/**'
