name: one-shot canonical API and R2 contract

on:
  push:
    branches:
      - feat/shared-auth-account-registry-api

permissions:
  contents: write

concurrency:
  group: one-shot-canonical-api-r2-contract
  cancel-in-progress: false

jobs:
  patch-test-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - name: Apply the reviewed source patch
        run: python3 scripts/apply_canonical_api_r2.py
      - name: Verify the complete exact-head Rust contract
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
      - name: Remove the one-shot carrier and patch script
        run: |
          set -euo pipefail
          rm .github/workflows/zz-canonical-api-r2-contract.yml
          rm scripts/apply_canonical_api_r2.py
          python3 - <<'PY'
          import subprocess
          allowed = {
              "src/storage.rs",
              "src/routes/publish.rs",
              "src/routes/mod.rs",
              "src/account_router.rs",
              ".github/workflows/registry-publish-e2e.yml",
              ".github/workflows/zz-canonical-api-r2-contract.yml",
              "scripts/apply_canonical_api_r2.py",
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(["git", "status", "--short"], text=True).splitlines()
              if line.strip()
          }
          if changed != allowed:
              raise SystemExit(f"unexpected delta: {sorted(changed ^ allowed)}")
          PY
      - name: Commit only the exact tested patch
        run: |
          set -euo pipefail
          tested_head="$(git rev-parse HEAD)"
          git fetch origin feat/shared-auth-account-registry-api
          remote_head="$(git rev-parse origin/feat/shared-auth-account-registry-api)"
          test "$tested_head" = "$remote_head" || { echo "branch advanced; refusing untested overwrite" >&2; exit 1; }
          git add src/storage.rs src/routes/publish.rs src/routes/mod.rs src/account_router.rs \
            .github/workflows/registry-publish-e2e.yml \
            .github/workflows/zz-canonical-api-r2-contract.yml \
            scripts/apply_canonical_api_r2.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(DEN-2788): canonicalize API routes and R2 keys"
          git push origin HEAD:feat/shared-auth-account-registry-api
