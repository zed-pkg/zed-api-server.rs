name: diagnose cargo lock

on:
  pull_request:

permissions:
  contents: read

jobs:
  lock-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve exact Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print(f"toolchain={tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']}")
          PY
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - name: Regenerate and print exact Cargo.lock delta
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          echo '=== CARGO_LOCK_DIFF_BEGIN ==='
          git diff -- Cargo.lock
          echo '=== CARGO_LOCK_DIFF_END ==='
          test -n "$(git diff -- Cargo.lock)"
