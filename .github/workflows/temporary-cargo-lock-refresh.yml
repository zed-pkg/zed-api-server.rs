name: temporary Cargo lock refresh

on:
  push:
    branches:
      - fix/artifact-response-middleware-contract-20260910

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Let Cargo refresh and verify the lock graph
        shell: bash
        run: |
          set -euo pipefail
          cargo check
          git diff --check
          test -n "$(git status --porcelain -- Cargo.lock)"
          git diff -- Cargo.lock
      - name: Commit only Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh Cargo lock for middleware features'
          git push origin HEAD:fix/artifact-response-middleware-contract-20260910
