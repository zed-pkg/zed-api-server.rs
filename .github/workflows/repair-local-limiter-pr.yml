name: Repair local limiter candidate

on:
  pull_request:
    paths:
      - src/ratelimit.rs
      - .github/workflows/repair-local-limiter-pr.yml
  workflow_dispatch:

# Temporary same-repository migration helper. Delete before merge.
permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'DEN-390-local-limiter-eviction-and-capacity-hardening')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-390-local-limiter-eviction-and-capacity-hardening
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Narrow injected-time hooks to tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ratelimit.rs")
          text = path.read_text()

          replacements = {
              '    pub fn check_at(&self, key: &str, now: Instant) -> Decision {':
                  '    #[cfg(test)]\n    fn check_at(&self, key: &str, now: Instant) -> Decision {',
              '    pub fn sweep_at(&self, now: Instant) {':
                  '    #[cfg(test)]\n    fn sweep_at(&self, now: Instant) {',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install exact repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --component rustfmt --component clippy --profile minimal --no-self-update
          rustup default "$toolchain"

      - name: Format and certify repaired source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked ratelimit
          cargo clippy --quiet --workspace --all-targets --locked -- -D warnings
          git diff --check
          changed="$(git status --porcelain | awk '{print $2}')"
          test "$changed" = "src/ratelimit.rs"
          grep -F '#[cfg(test)]' src/ratelimit.rs >/dev/null

      - name: Commit reviewed limiter repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ratelimit.rs
          git commit -m 'fix(DEN-390): keep injected limiter clocks test-only'
          git push origin HEAD:DEN-390-local-limiter-eviction-and-capacity-hardening
