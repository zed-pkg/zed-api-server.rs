name: rate-limit-lock-candidate

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/ratelimit.rs"
      - "src/server.rs"
      - ".github/workflows/rate-limit-lock-candidate.yml"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Resolve only the newly declared exact source
        run: cargo metadata --format-version 1 >/dev/null
      - name: Verify the candidate lock and integer adapter boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          commit = "32e65d27893695acd2c2372658918edde1a55ce4"
          repository = "https://github.com/ores-rate-limit/ores-rl-lib-core.git"
          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          dependency = manifest["dependencies"]["ores-rl-lib-core"]
          assert dependency == {"git": repository, "rev": commit}
          expected = f"git+{repository}?rev={commit}#{commit}"
          matches = [
              package for package in lock["package"]
              if package["name"] == "ores-rl-lib-core"
              and package.get("source") == expected
          ]
          assert len(matches) == 1, matches
          source = Path("src/ratelimit.rs").read_text()
          assert "f64" not in source
          assert "as_secs_f64" not in source
          assert "transition(self.policy" in source
          PY
      - name: Upload the exact candidate lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ores-rate-limit-cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
