name: apply baseline repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/remove-unused-k8s-data-plane-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Resolve exact Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print(f"toolchain={tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']}")
          PY
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - name: Regenerate canonical Cargo lock and apply reviewed parser fixes
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          sed -i 's/fn common_field_inventory_is a subset of every request shape()/fn common_field_inventory_is_a_subset_of_every_request_shape()/' .github/materialize/public_intake.rs
          sed -i 's/fn public_response_shapes cannot_reflect_submitted_identity()/fn public_response_shapes_cannot_reflect_submitted_identity()/' src/public_intake.rs
          git rm .github/workflows/diagnose-cargo-lock.yml .github/workflows/diagnose-zpkg-lock.yml .github/workflows/apply-baseline-repair.yml
          git diff --check
          grep -q 'name = "ed25519-dalek"' Cargo.lock
          grep -q '"ed25519-dalek"' Cargo.lock
          grep -q '"dotenvy"' Cargo.lock
      - name: Commit exact generated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/materialize/public_intake.rs src/public_intake.rs
          git commit -m 'fix: refresh locked Rust graph and parser identifiers'
          git push origin HEAD:fix/remove-unused-k8s-data-plane-20260915
