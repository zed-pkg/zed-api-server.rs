name: materialize binary E2E ignore fix

on:
  push:
    branches:
      - agent/verify-binary-uploads

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/verify-binary-uploads
          persist-credentials: false
      - name: Create corrected workflow blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          path = Path('.github/workflows/binary-publish-e2e.yml')
          source = path.read_text()
          old = "          printf 'target/\\n' >\"$package_dir/.gitignore\"\n"
          new = "          printf 'target/\\n.zed/\\n' >\"$package_dir/.gitignore\"\n"
          if source.count(old) != 1:
              raise SystemExit('expected exactly one fixture .gitignore marker')
          revised = source.replace(old, new, 1)
          request = Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=json.dumps({'content': revised, 'encoding': 'utf-8'}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'zed-binary-e2e-fix-materializer',
              },
              method='POST',
          )
          with urlopen(request) as response:
              blob = json.load(response)
          print('BLOB_SHA=' + blob['sha'])
          PY
