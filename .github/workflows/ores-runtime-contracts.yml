name: ORES runtime contracts
on:
  pull_request:
    paths: ['.zpkg.toml', '.zpkg.lock', '.cli-flags.toml', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ores-runtime-contracts.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ores-runtime-contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  ZED_CLI_REV: a1c5b7a3c72b957944b76911fcbc723dd9c16541
  FLAGS2ENV_REV: 333c2ace93c362d274171ab0e0edf613d96a8e59
  ORES_CLI_REV: 19063469d3bf399415d520386e4e9423c4c5fde6
  ORES_CLI_TOOLCHAIN: 1.95.0
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: '${{ env.EXPECTED_HEAD }}', persist-credentials: false }
      - name: Build pinned tools and execute authored contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"; test -f .zpkg.toml; test -f .cli-flags.toml
          git clone --filter=blob:none https://github.com/zed-pkg/zed-cli.git "$RUNNER_TEMP/zed-cli"; git -C "$RUNNER_TEMP/zed-cli" checkout --detach "$ZED_CLI_REV"; (cd "$RUNNER_TEMP/zed-cli" && cargo build --locked --release --bin zed)
          git clone --filter=blob:none https://github.com/flags-2-env/flags-2-env.git "$RUNNER_TEMP/flags2env"; git -C "$RUNNER_TEMP/flags2env" checkout --detach "$FLAGS2ENV_REV"; make -C "$RUNNER_TEMP/flags2env" all
          rustup toolchain install "$ORES_CLI_TOOLCHAIN" --profile minimal --no-self-update
          git clone --filter=blob:none https://github.com/ORESoftware/ores-cli.git "$RUNNER_TEMP/ores-cli"; git -C "$RUNNER_TEMP/ores-cli" checkout --detach "$ORES_CLI_REV"; rustup run "$ORES_CLI_TOOLCHAIN" cargo build --manifest-path "$RUNNER_TEMP/ores-cli/Cargo.toml" --locked --release --bin oresc --bin ores-cli
          "$RUNNER_TEMP/zed-cli/target/release/zed" validate --manifest .zpkg.toml
          "$RUNNER_TEMP/flags2env/build/flags2env" audit .cli-flags.toml
          "$RUNNER_TEMP/ores-cli/target/release/oresc" --no-json audit repo --path . --profile baseline
          "$RUNNER_TEMP/ores-cli/target/release/ores-cli" --no-json audit repo --path . --profile baseline
          ! grep -R --line-number --fixed-strings 'github.com/ORESoftware/flags-2-env' Cargo.toml Cargo.lock .zpkg.toml 2>/dev/null
          git diff --exit-code HEAD
