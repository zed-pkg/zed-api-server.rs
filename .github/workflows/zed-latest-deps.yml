name: Zed latest dependency gate
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: zed-latest-deps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  ZED_PKG_INTERACTIVE: "false"
  ZED_CLI_COMMIT: eb5656e974105677982f533c6ae24f2c99abdf2e
jobs:
  zed-latest-deps:
    name: zed-latest-deps
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: "${{ github.token }}"
      ZED_PKG_GITHUB_TOKEN: "${{ github.token }}"
      ZED_PKG_SOURCE_FALLBACK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out fixed commit-pinned Zed CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: reviewed-tools/zed-cli
          persist-credentials: false
      - name: Build fixed Zed CLI from exact source
        working-directory: reviewed-tools/zed-cli
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZED_CLI_COMMIT"
          cargo build --locked --bin zed
          mkdir -p "$RUNNER_TEMP/zed-bin"
          install -m 0755 target/debug/zed "$RUNNER_TEMP/zed-bin/zed"
          echo "$RUNNER_TEMP/zed-bin" >> "$GITHUB_PATH"
      - run: zed --version
      - name: Resolve newest allowed Zed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          zed install
          zed validate --require-lock
          git --no-pager diff -- .zpkg.lock || true
      - name: Run repository dependency gate
        run: bash .githooks/pre-push --ci
      - name: Retain resolver-produced lock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-api-server-resolved-lock
          path: .zpkg.lock
          if-no-files-found: error
          retention-days: 14
