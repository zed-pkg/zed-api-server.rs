name: retry public intake API after persistence finalization

on:
  push:
    branches:
      - feat/public-intake-api-v1
    paths:
      - .github/workflows/retry-public-intake-api.yml

permissions:
  contents: write

concurrency:
  group: retry-public-intake-api-v1
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out API branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/public-intake-api-v1
          path: zed-api-server
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Check out persistence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-lib-core
          ref: feat/public-intake-persistence-clean
          path: zed-lib-core
          persist-credentials: false
          show-progress: false

      - name: Trigger only from a final persistence tree
        working-directory: zed-api-server
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ../zed-lib-core/.github/workflows/finalize-public-intake-persistence.yml
          test ! -e ../zed-lib-core/.github/workflows/materialize-public-intake-persistence.yml
          test -s ../zed-lib-core/.github/workflows/public-intake-persistence.yml
          test -s ../zed-lib-core/src/rust-orm/public_intake.rs
          grep -q "insert_public_intake_submission" ../zed-lib-core/src/rust-orm/write.rs

          printf '%s\n' "$(date -u +%FT%TZ)" > .materialize-public-intake-api-trigger
          rm -f .github/workflows/retry-public-intake-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci(intake): retry signed API materialization"
          git push origin HEAD:feat/public-intake-api-v1
