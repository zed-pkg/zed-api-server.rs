# Fast Rust CI: immutable source graph, mold as the linker, cargo-nextest for
# parallel tests, and a dependency cache that degrades gracefully.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: zed-api-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZED_INTERFACES_SHA: f141e4cfae31a74c679b46d1d4bb0146b20555f6
  ZED_ORM_SHA: c924cc61689c62d5df8f4cb190fa09f7f513f644

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the standalone immutable source graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e ../zed-interfaces
          test ! -e ../zed-lib
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          interfaces = manifest["dependencies"]["zed-interfaces"]
          orm = manifest["dependencies"]["zed-orm"]
          expected_interfaces = "f141e4cfae31a74c679b46d1d4bb0146b20555f6"
          expected_orm = "c924cc61689c62d5df8f4cb190fa09f7f513f644"
          assert "path" not in interfaces, interfaces
          assert interfaces["rev"] == expected_interfaces, interfaces
          assert "path" not in orm, orm
          assert orm["rev"] == expected_orm, orm
          assert orm["package"] == "zed-orm", orm
          lock = Path("Cargo.lock").read_text()
          interface_source = (
              "git+https://github.com/zed-pkg/zed-interfaces.git?"
              f"rev={expected_interfaces}#{expected_interfaces}"
          )
          orm_source = (
              "git+https://github.com/zed-pkg/zed-lib.git?"
              f"rev={expected_orm}#{expected_orm}"
          )
          assert interface_source in lock, "Cargo.lock does not pin zed-interfaces"
          assert orm_source in lock, "Cargo.lock does not pin zed-orm"
          PY
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Install mold (fast linker)
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: tests
      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6e08638ce5ee7b285b1e051c006e3be64fcff91 # nextest
      - name: Resolve only the committed lockfile
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Format
        run: cargo fmt --check
      - name: Test (nextest)
        run: cargo nextest run --workspace --locked
      - name: Doctests
        run: cargo test --workspace --doc --locked

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - name: Install mold (fast linker)
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: clippy
      - name: Deny every Rust warning from the committed lockfile
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --quiet --workspace --all-targets --locked -- -D warnings 2>&1 \
            | tee "$RUNNER_TEMP/clippy.log"
