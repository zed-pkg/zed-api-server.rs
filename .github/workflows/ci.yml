# Fast Rust CI: immutable source graph, mold as the linker, cargo-nextest for
# parallel tests, and a dependency cache that degrades gracefully.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: zed-api-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  ZED_INTERFACES_SHA: 996fc56e20c4bb41366377be14edfae886b84e82
  ZED_LIB_CORE_SHA: c3d486a1519381276fbec02aa25247f542924443

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Checkout pinned shared interfaces for source verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: reviewed-dependencies/zed-interfaces
          persist-credentials: false
      - name: Checkout pinned canonical ORM for source verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg/zed-lib-core
          ref: ${{ env.ZED_LIB_CORE_SHA }}
          path: reviewed-dependencies/zed-lib-core
          persist-credentials: false
      - name: Verify the standalone immutable source graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C reviewed-dependencies/zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_SHA"
          test "$(git -C reviewed-dependencies/zed-lib-core rev-parse HEAD)" = "$ZED_LIB_CORE_SHA"
          test ! -e ../zed-interfaces
          test ! -e ../zed-lib-core
          test "$(sed -n 's/^  ZED_INTERFACES_SHA: //p' .github/workflows/publish-container.yml)" = "$ZED_INTERFACES_SHA"
          test "$(sed -n 's/^  ZED_LIB_CORE_SHA: //p' .github/workflows/publish-container.yml)" = "$ZED_LIB_CORE_SHA"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          pins = {
              "zed-interfaces": (
                  "https://github.com/zed-pkg/zed-interfaces.git",
                  os.environ["ZED_INTERFACES_SHA"],
              ),
              "zed-orm-core": (
                  "https://github.com/zed-pkg/zed-lib-core.git",
                  os.environ["ZED_LIB_CORE_SHA"],
              ),
          }

          for package, (repository, revision) in pins.items():
              spec = manifest["dependencies"][package]
              assert "path" not in spec, spec
              assert spec["git"] == repository, spec
              assert spec["rev"] == revision, spec
              expected_source = f"git+{repository}?rev={revision}#{revision}"
              matches = [
                  entry for entry in lock["package"]
                  if entry["name"] == package and entry.get("source") == expected_source
              ]
              assert len(matches) == 1, (
                  f"Cargo.lock does not uniquely pin {package} to {expected_source}"
              )
          PY
      - name: Resolve and verify exact Rust toolchain contract
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", toolchain):
              raise SystemExit(f"Rust toolchain must be patch-exact, got {toolchain!r}")
          dockerfile = Path("Dockerfile").read_text()
          assert f"FROM rust:{toolchain}-slim-bookworm AS build" in dockerfile
          assert f"ENV RUSTUP_TOOLCHAIN={toolchain}" in dockerfile
          print(f"toolchain={toolchain}")
          PY
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt
      - name: Install mold (fast linker)
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: tests
      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6e08638ce5ee7b285b1e051c006e3be64fcff91 # nextest
      - name: Resolve only the committed lockfile
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Format
        run: cargo fmt --check
      - name: Test (nextest)
        run: cargo nextest run --workspace --locked
      - name: Doctests
        run: cargo test --workspace --doc --locked

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact contributor head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Resolve exact Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path
          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", toolchain):
              raise SystemExit(f"Rust toolchain must be patch-exact, got {toolchain!r}")
          print(f"toolchain={toolchain}")
          PY
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy
      - name: Install mold (fast linker)
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: clippy
      - name: Test differential Clippy comparator
        run: cargo test --locked --bin ci-differential-clippy
      - name: Reject net-new Rust warnings from the committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base_sha}^{commit}"
          base_tree="$RUNNER_TEMP/clippy-base"
          trap 'git worktree remove --force "$base_tree" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$base_tree" "$base_sha"

          (
            cd "$base_tree"
            CARGO_TARGET_DIR="$RUNNER_TEMP/clippy-target-base" \
              cargo clippy --workspace --all-targets --locked --message-format=json \
              > "$RUNNER_TEMP/clippy-base.json"
          )
          CARGO_TARGET_DIR="$RUNNER_TEMP/clippy-target-head" \
            cargo clippy --workspace --all-targets --locked --message-format=json \
            > "$RUNNER_TEMP/clippy-head.json"

          cargo run --quiet --locked --bin ci-differential-clippy -- \
            --base "$RUNNER_TEMP/clippy-base.json" \
            --head "$RUNNER_TEMP/clippy-head.json"
