name: api-docs-contract

on:
  push:
    branches: [main]
    paths:
      - openapi/**
      - src/api_docs.rs
      - src/account_router.rs
      - src/main.rs
      - src/routes/**
      - src/server.rs
      - .github/workflows/api-docs-contract.yml
  pull_request:
    paths:
      - openapi/**
      - src/api_docs.rs
      - src/account_router.rs
      - src/main.rs
      - src/routes/**
      - src/server.rs
      - .github/workflows/api-docs-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out API source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the exact shared API-docs contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ORESoftware/mcp-rust-libs
          ref: 47e411311523013f90db98390671d683475d6c74
          path: .api-docs-contract
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate manifest, OpenAPI operations, and same-org MCP pairing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool openapi/api-docs.manifest.json >/dev/null
          python3 -m json.tool openapi/zed.openapi.json >/dev/null
          python3 .api-docs-contract/tooling/validate_api_docs_contract.py \
            --manifest openapi/api-docs.manifest.json \
            --openapi openapi/zed.openapi.json \
            --expected-mcp-repository zed-pkg/zed-mcp-server.rs \
            --operations

      - name: Verify exact digest and public router boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('openapi/api-docs.manifest.json').read_text(encoding='utf-8'))
          openapi_bytes = Path('openapi/zed.openapi.json').read_bytes()
          digest = hashlib.sha256(openapi_bytes).hexdigest()
          assert manifest['public']['openapi']['sha256'] == digest
          assert manifest['provenance']['sourceRepository'] == 'zed-pkg/zed-api-server.rs'
          assert manifest['mcp']['repository'] == 'zed-pkg/zed-mcp-server.rs'
          assert manifest['mcp']['mode'] == 'read-only'
          assert manifest['internal']['available'] is False
          PY
          git grep -qF 'merge(api_docs::router())' -- src/server.rs
          git grep -qF 'merge(routes::router(state.clone(), cfg.max_artifact_bytes))' -- src/server.rs
          git grep -qF 'merge(account_router::router(state))' -- src/server.rs
          git grep -qF 'ROUTE_DECLARED_GRAPH' -- src/api_docs.rs
          git grep -qF 'ROUTE_RESOLUTION_GRAPH' -- src/api_docs.rs
          if git grep -nE 'api_docs::router\(\).*ratelimit|ratelimit.*api_docs::router\(\)' -- src; then
            echo 'API documentation must remain outside the authenticated registry middleware' >&2
            exit 1
          fi
          git diff --check

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/api-docs-contract.yml
