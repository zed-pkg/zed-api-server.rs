name: apply canonical core API cutover

on:
  pull_request:
    branches:
      - feat/shared-auth-account-registry-api
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-canonical-core-api
  cancel-in-progress: false

env:
  ZED_ORM_CORE_SHA: 700f1f9578c6633a20693a5b1f52970ab845a740
  ZED_INTERFACES_SHA: f141e4cfae31a74c679b46d1d4bb0146b20555f6

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/den-2788-canonical-core-api
          fetch-depth: 0
          persist-credentials: true
      - name: Install the stable Rust verification surface
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt,clippy
      - name: Apply assertion-checked source repairs
        run: python3 scripts/ci/apply-canonical-core-api.py
      - name: Resolve only the new immutable dependency and format
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo metadata --locked --format-version 1 >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          manifest = tomllib.loads(Path('Cargo.toml').read_text())
          core = manifest['dependencies']['zed-orm-core']
          assert core['rev'] == '700f1f9578c6633a20693a5b1f52970ab845a740', core
          assert set(core['features']) == {'read-write', 'migrate'}, core
          assert 'zed-orm' not in manifest['dependencies'], manifest['dependencies']
          lock = Path('Cargo.lock').read_text()
          expected = (
              'git+https://github.com/zed-pkg/zed-lib-core.git?rev='
              '700f1f9578c6633a20693a5b1f52970ab845a740#'
              '700f1f9578c6633a20693a5b1f52970ab845a740'
          )
          assert expected in lock, 'Cargo.lock does not pin the merged canonical core'
          assert 'github.com/zed-pkg/zed-lib.git' not in lock, 'transitional zed-lib remains in lock'
          PY
      - name: Deny warnings and run every target
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo test --workspace --doc --locked
          cargo build --workspace --release --locked
      - name: Verify the canonical boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings 'zed_orm::' src
          grep -Fq 'adopt_machine_publish' src/routes/publish.rs
          grep -Fq 'registry_read: Some' src/server.rs
          grep -Fq 'registry_write: Some' src/server.rs
          grep -Fq '.nest("/api/v1"' src/account_router.rs
          grep -Fq 'visibility_is_not_part_of_the_general_settings_request' src/routes/account.rs
      - name: Commit the verified graph and remove one-shot carriers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-apply-canonical-core-api.yml
          git rm scripts/ci/apply-canonical-core-api.py
          git add Cargo.toml Cargo.lock src
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(DEN-2788): cut the API over to zed-orm-core'
          git push origin HEAD:feat/den-2788-canonical-core-api
