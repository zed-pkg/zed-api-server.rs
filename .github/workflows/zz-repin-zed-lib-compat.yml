name: one-shot zed-lib compatibility repin

on:
  push:
    branches:
      - feat/shared-auth-account-registry-api

permissions:
  contents: write

concurrency:
  group: one-shot-zed-lib-compat-repin
  cancel-in-progress: false

jobs:
  repin-lock-test-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact feature head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install the stable Rust verification toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Repin only the established zed-lib facade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text()
          old = 'zed-orm = { git = "https://github.com/zed-pkg/zed-lib.git", rev = "f6f240a72eb100b858ae74f2c633d09528b61805", package = "zed-orm" }'
          new = 'zed-orm = { git = "https://github.com/zed-pkg/zed-lib.git", rev = "3f96becea62efb452d1630e7e67711404e8131f2", package = "zed-orm" }'
          if text.count(old) != 1 or new in text:
              raise SystemExit("Cargo.toml is not at the single reviewed predecessor pin")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Resolve the minimal immutable graph delta
        run: cargo check --workspace --all-targets

      - name: Verify formatting, graph, warnings, and tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Remove the carrier and constrain the tested commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-repin-zed-lib-compat.yml
          python3 - <<'PY'
          import subprocess

          allowed = {"Cargo.toml", "Cargo.lock", ".github/workflows/zz-repin-zed-lib-compat.yml"}
          changed = {
              line[3:]
              for line in subprocess.check_output(["git", "status", "--short"], text=True).splitlines()
              if line.strip()
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected files changed: {sorted(unexpected)}")
          required = {"Cargo.toml", "Cargo.lock", ".github/workflows/zz-repin-zed-lib-compat.yml"}
          if not required.issubset(changed):
              raise SystemExit(f"missing expected changes: {sorted(required - changed)}")
          PY

      - name: Commit only the exact tested dependency graph
        shell: bash
        run: |
          set -euo pipefail
          tested_head="$(git rev-parse HEAD)"
          git fetch origin feat/shared-auth-account-registry-api
          remote_head="$(git rev-parse origin/feat/shared-auth-account-registry-api)"
          if test "$tested_head" != "$remote_head"; then
            echo "The feature branch advanced during validation; refusing an untested overwrite." >&2
            exit 1
          fi
          git add Cargo.toml Cargo.lock .github/workflows/zz-repin-zed-lib-compat.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(DEN-2788): consume org-name compatibility migration"
          git push origin HEAD:feat/shared-auth-account-registry-api
