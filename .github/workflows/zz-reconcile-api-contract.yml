name: reconcile canonical account and registry API

on:
  push:
    branches:
      - feat/shared-auth-account-registry-api
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-canonical-api-contract
  cancel-in-progress: false

jobs:
  patch-validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile account and registry routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          account_router = Path("src/account_router.rs")
          old_router = account_router.read_text()
          required_markers = [
              'pub fn router(state: Arc<AppState>) -> Router {',
              '.route("/v1/account/me",',
              '.route("/v1/account/home", get(account::home))',
              '#[cfg(test)]',
          ]
          for marker in required_markers:
              if marker not in old_router:
                  raise SystemExit(f"src/account_router.rs: missing expected marker {marker!r}")
          if '"/api/v1/users/me"' in old_router:
              raise SystemExit("src/account_router.rs already contains a canonical route; inspect before retrying")

          account_router.write_text(r'''use std::sync::Arc;
          use std::time::Duration;

          use axum::Router;
          use axum::extract::DefaultBodyLimit;
          use axum::http::{HeaderValue, header};
          use axum::routing::{get, post, put};

          use crate::account;
          use crate::state::AppState;

          const ACCOUNT_BODY_LIMIT: usize = 64 * 1024;
          const ACCOUNT_TIMEOUT: Duration = Duration::from_secs(15);
          const ACCOUNT_MAX_IN_FLIGHT: usize = 256;

          /// Account and organization management is intentionally isolated from legacy
          /// package-token routes. It carries the same resource/security layers while
          /// using Shared Auth plus zed-orm membership authorization.
          ///
          /// `/api/v1` is canonical. The `/v1` and `/v1/account` routes remain bounded
          /// compatibility aliases while the CLI, SDKs, and web console migrate.
          pub fn router(state: Arc<AppState>) -> Router {
              Router::new()
                  // Canonical product/account API.
                  .route("/api/v1/auth/config", get(account::auth_config))
                  .route("/api/v1/auth/exchange", post(account::exchange_supabase))
                  .route(
                      "/api/v1/users/me",
                      get(account::me)
                          .put(account::update_user_settings)
                          .patch(account::update_user_settings),
                  )
                  .route("/api/v1/home", get(account::home))
                  .route("/api/v1/search", get(account::search))
                  .route("/api/v1/orgs", post(account::create_org))
                  .route("/api/v1/orgs/{org}", get(account::org_dashboard))
                  .route(
                      "/api/v1/orgs/{org}/invitations",
                      post(account::invite_org_member),
                  )
                  .route(
                      "/api/v1/orgs/{org}/projects",
                      post(account::create_project),
                  )
                  .route(
                      "/api/v1/orgs/{org}/projects/{project}",
                      get(account::get_project),
                  )
                  .route(
                      "/api/v1/orgs/{org}/projects/{project}/invitations",
                      post(account::invite_project_member),
                  )
                  .route(
                      "/api/v1/orgs/{org}/projects/{project}/packages",
                      post(account::create_project_package),
                  )
                  .route(
                      "/api/v1/orgs/{org}/packages",
                      post(account::create_package),
                  )
                  .route(
                      "/api/v1/orgs/{org}/packages/{package}",
                      get(account::get_package)
                          .put(account::update_package_settings)
                          .patch(account::update_package_settings),
                  )
                  .route(
                      "/api/v1/orgs/{org}/packages/{package}/public",
                      post(account::make_package_public),
                  )
                  .route(
                      "/api/v1/orgs/{org}/packages/{package}/licenses",
                      post(account::add_package_license),
                  )
                  .route(
                      "/api/v1/orgs/{org}/packages/{package}/uploads",
                      post(account::register_package_upload),
                  )
                  // Compatibility aliases for the current web/CLI generation.
                  .route("/v1/auth/config", get(account::auth_config))
                  .route("/v1/auth/exchange", post(account::exchange_supabase))
                  .route(
                      "/v1/account/me",
                      get(account::me)
                          .put(account::update_user_settings)
                          .patch(account::update_user_settings),
                  )
                  .route(
                      "/v1/me",
                      get(account::me)
                          .put(account::update_user_settings)
                          .patch(account::update_user_settings),
                  )
                  .route("/v1/account/home", get(account::home))
                  .route("/v1/me/home", get(account::home))
                  .route("/v1/account/search", get(account::search))
                  .route("/v1/account/orgs", post(account::create_org))
                  .route("/v1/account/orgs/{org}", get(account::org_dashboard))
                  .route(
                      "/v1/account/orgs/{org}/dashboard",
                      get(account::org_dashboard),
                  )
                  .route(
                      "/v1/account/orgs/{org}/invitations",
                      post(account::invite_org_member),
                  )
                  .route(
                      "/v1/account/orgs/{org}/projects",
                      post(account::create_project),
                  )
                  .route(
                      "/v1/account/orgs/{org}/projects/{project}",
                      get(account::get_project),
                  )
                  .route(
                      "/v1/account/orgs/{org}/projects/{project}/invitations",
                      post(account::invite_project_member),
                  )
                  .route(
                      "/v1/account/orgs/{org}/projects/{project}/packages",
                      post(account::create_project_package),
                  )
                  .route(
                      "/v1/account/orgs/{org}/packages",
                      post(account::create_package),
                  )
                  .route(
                      "/v1/account/orgs/{org}/packages/{package}",
                      get(account::get_package)
                          .put(account::update_package_settings)
                          .patch(account::update_package_settings),
                  )
                  .route(
                      "/v1/account/orgs/{org}/packages/{package}/settings",
                      put(account::update_package_settings),
                  )
                  .route(
                      "/v1/account/orgs/{org}/packages/{package}/public",
                      post(account::make_package_public),
                  )
                  .route(
                      "/v1/account/orgs/{org}/packages/{package}/licenses",
                      post(account::add_package_license),
                  )
                  .route(
                      "/v1/account/orgs/{org}/packages/{package}/uploads",
                      post(account::register_package_upload),
                  )
                  .layer(DefaultBodyLimit::max(ACCOUNT_BODY_LIMIT))
                  .layer(axum::middleware::from_fn_with_state(
                      state.clone(),
                      crate::ratelimit::layer,
                  ))
                  .layer(tower_http::trace::TraceLayer::new_for_http())
                  .layer(tower::limit::ConcurrencyLimitLayer::new(
                      ACCOUNT_MAX_IN_FLIGHT,
                  ))
                  .layer(tower_http::timeout::TimeoutLayer::with_status_code(
                      axum::http::StatusCode::REQUEST_TIMEOUT,
                      ACCOUNT_TIMEOUT,
                  ))
                  .layer(tower_http::set_header::SetResponseHeaderLayer::overriding(
                      header::X_CONTENT_TYPE_OPTIONS,
                      HeaderValue::from_static("nosniff"),
                  ))
                  .with_state(state)
          }

          #[cfg(test)]
          mod tests {
              #[test]
              fn canonical_account_routes_live_under_api_v1() {
                  for route in [
                      "/api/v1/users/me",
                      "/api/v1/home",
                      "/api/v1/orgs/{org}",
                      "/api/v1/orgs/{org}/projects/{project}",
                      "/api/v1/orgs/{org}/packages/{package}",
                  ] {
                      assert!(route.starts_with("/api/v1/"));
                      assert!(!route.contains("/registry/"));
                  }
              }

              #[test]
              fn compatibility_routes_remain_bounded_to_v1() {
                  for route in [
                      "/v1/account/me",
                      "/v1/account/home",
                      "/v1/account/orgs/{org}",
                      "/v1/account/orgs/{org}/packages/{package}/public",
                  ] {
                      assert!(route.starts_with("/v1/account/"));
                  }
              }
          }
          '''.replace("          ", ""))

          account = Path("src/routes/account.rs")
          text = account.read_text()
          if 'pub async fn get_project(' in text or 'pub async fn get_package(' in text:
              raise SystemExit("src/routes/account.rs already contains read handlers; inspect before retrying")

          text = text.replace(
              '"supabase_exchange": "/v1/auth/exchange"',
              '"supabase_exchange": "/api/v1/auth/exchange",\n        "legacy_supabase_exchange": "/v1/auth/exchange"',
              1,
          )
          text = text.replace(
              '        "settings": org.settings\n',
              '        "settings": org.settings,\n        "role": "owner"\n',
              1,
          )
          text = text.replace(
              '        "settings": project.settings\n',
              '        "settings": project.settings,\n        "org_slug": org_slug,\n        "role": "owner"\n',
              1,
          )

          project_marker = 'pub async fn invite_project_member('
          if text.count(project_marker) != 1:
              raise SystemExit("src/routes/account.rs: project insertion marker is ambiguous")
          project_handlers = r'''
          pub async fn get_project(
              State(state): State<Arc<AppState>>,
              headers: HeaderMap,
              Path((org_slug, project_slug)): Path<(String, String)>,
          ) -> ApiResult<Json<JsonValue>> {
              let account = authenticated_and_projected(&state, &headers).await?;
              let project = zed_orm::queries::read::project_for_user(
                  &state.db,
                  account.subject(),
                  &org_slug,
                  &project_slug,
              )
              .await
              .map_err(map_db_error)?
              .ok_or_else(|| ApiErr::not_found("project"))?;
              Ok(Json(project_summary_value(project)))
          }

          pub async fn create_project_package(
              State(state): State<Arc<AppState>>,
              headers: HeaderMap,
              Path((org_slug, project_slug)): Path<(String, String)>,
              Json(request): Json<CreatePackageRequest>,
          ) -> ApiResult<Json<JsonValue>> {
              let account = authenticated_and_projected(&state, &headers).await?;
              let project = zed_orm::queries::read::project_for_user(
                  &state.db,
                  account.subject(),
                  &org_slug,
                  &project_slug,
              )
              .await
              .map_err(map_db_error)?
              .ok_or_else(|| ApiErr::not_found("project"))?;
              if let Some(requested_project_id) = request.project_id
                  && requested_project_id != project.id
              {
                  return Err(ApiErr::bad_request(
                      "project_mismatch",
                      "the package project_id must match the project in the route",
                  ));
              }
              let package = zed_orm::registry::create_package(
                  &state.db,
                  &account.federated,
                  &org_slug,
                  CreatePackageInput {
                      project_id: Some(project.id),
                      name: request.name,
                      description: request.description,
                      vcs: request.vcs,
                      repo_url: request.repo_url,
                      config: request.config,
                      default_archive_format: request.default_archive_format,
                  },
              )
              .await
              .map_err(map_db_error)?;
              Ok(Json(package_value(package)))
          }

          '''.replace("          ", "")
          text = text.replace(project_marker, project_handlers + project_marker, 1)

          package_marker = 'pub async fn update_package_settings('
          if text.count(package_marker) != 1:
              raise SystemExit("src/routes/account.rs: package insertion marker is ambiguous")
          package_handler = r'''
          pub async fn get_package(
              State(state): State<Arc<AppState>>,
              headers: HeaderMap,
              Path((org_slug, package_name)): Path<(String, String)>,
          ) -> ApiResult<Json<JsonValue>> {
              let account = authenticated_and_projected(&state, &headers).await?;
              let package = zed_orm::queries::read::package_for_user(
                  &state.db,
                  account.subject(),
                  &org_slug,
                  &package_name,
              )
              .await
              .map_err(map_db_error)?
              .ok_or_else(|| ApiErr::not_found("package"))?;
              Ok(Json(package_summary_value(package)))
          }

          '''.replace("          ", "")
          text = text.replace(package_marker, package_handler + package_marker, 1)
          account.write_text(text)

          routes = Path("src/routes/mod.rs")
          text = routes.read_text()
          if 'CANONICAL_ROUTE_PACKAGE' in text:
              raise SystemExit("src/routes/mod.rs already contains canonical aliases; inspect before retrying")
          constants_marker = 'pub const ROUTE_FILES: &str = "/v1/files/{org}/{name}/{version}/{*path}";\n'
          if text.count(constants_marker) != 1:
              raise SystemExit("src/routes/mod.rs: route constant marker is ambiguous")
          canonical_constants = r'''

          pub const CANONICAL_REGISTRY_PREFIX: &str = "/api/v1/registry";
          pub const CANONICAL_ROUTE_PACKAGE: &str =
              "/api/v1/registry/packages/{org}/{name}";
          pub const CANONICAL_ROUTE_VERSION: &str =
              "/api/v1/registry/packages/{org}/{name}/versions/{version}";
          pub const CANONICAL_ROUTE_YANK: &str =
              "/api/v1/registry/packages/{org}/{name}/versions/{version}/yank";
          pub const CANONICAL_ROUTE_ARTIFACT: &str = "/api/v1/registry/artifacts/{sha256}";
          pub const CANONICAL_ROUTE_SEARCH: &str = "/api/v1/registry/search";
          pub const CANONICAL_ROUTE_PACKAGES_LIST: &str = "/api/v1/registry/packages";
          pub const CANONICAL_ROUTE_SEMANTIC: &str = "/api/v1/registry/search/semantic";
          pub const CANONICAL_ROUTE_EMBEDDING: &str =
              "/api/v1/registry/packages/{org}/{name}/embedding";
          pub const CANONICAL_ROUTE_ORGS: &str = "/api/v1/registry/orgs";
          pub const CANONICAL_ROUTE_AUDIT: &str = "/api/v1/registry/orgs/{org}/audit";
          pub const CANONICAL_ROUTE_AUDIT_VERIFY: &str =
              "/api/v1/registry/orgs/{org}/audit/verify";
          pub const CANONICAL_ROUTE_FILES: &str =
              "/api/v1/registry/files/{org}/{name}/{version}/{*path}";
          '''.replace("          ", "")
          text = text.replace(constants_marker, constants_marker + canonical_constants, 1)

          old_artifacts = '''    let artifact_routes = Router::new()
                  .route(ROUTE_ARTIFACT, get(artifacts::get_artifact))
                  .route(ROUTE_FILES, get(artifacts::get_file))'''.replace("        ", "")
          new_artifacts = '''    let artifact_routes = Router::new()
                  .route(ROUTE_ARTIFACT, get(artifacts::get_artifact))
                  .route(CANONICAL_ROUTE_ARTIFACT, get(artifacts::get_artifact))
                  .route(ROUTE_FILES, get(artifacts::get_file))
                  .route(CANONICAL_ROUTE_FILES, get(artifacts::get_file))'''.replace("        ", "")
          if text.count(old_artifacts) != 1:
              raise SystemExit("src/routes/mod.rs: artifact route marker is ambiguous")
          text = text.replace(old_artifacts, new_artifacts, 1)

          old_publish = '''    let publish_route = Router::new()
                  .route(
                      ROUTE_VERSION,
                      get(packages::get_version).put(publish::publish),
                  )'''.replace("        ", "")
          new_publish = '''    let publish_route = Router::new()
                  .route(
                      ROUTE_VERSION,
                      get(packages::get_version).put(publish::publish),
                  )
                  .route(
                      CANONICAL_ROUTE_VERSION,
                      get(packages::get_version).put(publish::publish),
                  )'''.replace("        ", "")
          if text.count(old_publish) != 1:
              raise SystemExit("src/routes/mod.rs: publish route marker is ambiguous")
          text = text.replace(old_publish, new_publish, 1)

          old_main = '''    Router::new()
                  .route("/healthz", get(healthz))
                  .route(ROUTE_PACKAGES_LIST, get(list::list_packages))
                  .route(ROUTE_PACKAGE, get(packages::get_package))
                  .route(
                      ROUTE_EMBEDDING,
                      axum::routing::put(semantic::upsert_embedding),
                  )
                  .route(ROUTE_YANK, post(yank::yank))
                  .route(ROUTE_SEARCH, get(search::search))
                  .route(ROUTE_SEMANTIC, post(semantic::semantic_search))
                  .route(ROUTE_ORGS, post(orgs::claim_org))
                  .route(ROUTE_AUDIT, get(audit::get_audit_log))
                  .route(ROUTE_AUDIT_VERIFY, get(audit::verify_audit_log))
                  .merge(artifact_routes)'''.replace("        ", "")
          new_main = '''    Router::new()
                  .route("/healthz", get(healthz))
                  .route("/api/v1/registry/healthz", get(healthz))
                  .route(ROUTE_PACKAGES_LIST, get(list::list_packages))
                  .route(CANONICAL_ROUTE_PACKAGES_LIST, get(list::list_packages))
                  .route(ROUTE_PACKAGE, get(packages::get_package))
                  .route(CANONICAL_ROUTE_PACKAGE, get(packages::get_package))
                  .route(
                      ROUTE_EMBEDDING,
                      axum::routing::put(semantic::upsert_embedding),
                  )
                  .route(
                      CANONICAL_ROUTE_EMBEDDING,
                      axum::routing::put(semantic::upsert_embedding),
                  )
                  .route(ROUTE_YANK, post(yank::yank))
                  .route(CANONICAL_ROUTE_YANK, post(yank::yank))
                  .route(ROUTE_SEARCH, get(search::search))
                  .route(CANONICAL_ROUTE_SEARCH, get(search::search))
                  .route(ROUTE_SEMANTIC, post(semantic::semantic_search))
                  .route(CANONICAL_ROUTE_SEMANTIC, post(semantic::semantic_search))
                  .route(ROUTE_ORGS, post(orgs::claim_org))
                  .route(CANONICAL_ROUTE_ORGS, post(orgs::claim_org))
                  .route(ROUTE_AUDIT, get(audit::get_audit_log))
                  .route(CANONICAL_ROUTE_AUDIT, get(audit::get_audit_log))
                  .route(ROUTE_AUDIT_VERIFY, get(audit::verify_audit_log))
                  .route(
                      CANONICAL_ROUTE_AUDIT_VERIFY,
                      get(audit::verify_audit_log),
                  )
                  .merge(artifact_routes)'''.replace("        ", "")
          if text.count(old_main) != 1:
              raise SystemExit("src/routes/mod.rs: main route marker is ambiguous")
          text = text.replace(old_main, new_main, 1)

          old_download = '''        download_url: format!(
                      "{}{}",
                      state.public_base_url,
                      zed_interfaces::registry::artifact_path(&row.sha256)
                  ),'''.replace("        ", "")
          new_download = '''        download_url: format!(
                      "{}/api/v1/registry/artifacts/{}",
                      state.public_base_url.trim_end_matches('/'),
                      row.sha256
                  ),'''.replace("        ", "")
          if text.count(old_download) != 1:
              raise SystemExit("src/routes/mod.rs: download URL marker is ambiguous")
          text = text.replace(old_download, new_download, 1)

          test_marker = '    #[tokio::test]\n    async fn healthz_works_without_a_database() {'
          if text.count(test_marker) != 1:
              raise SystemExit("src/routes/mod.rs: canonical route test marker is ambiguous")
          route_test = r'''    #[test]
              fn canonical_registry_routes_are_a_subset_of_the_product_api() {
                  for route in [
                      CANONICAL_ROUTE_PACKAGE,
                      CANONICAL_ROUTE_VERSION,
                      CANONICAL_ROUTE_YANK,
                      CANONICAL_ROUTE_ARTIFACT,
                      CANONICAL_ROUTE_SEARCH,
                      CANONICAL_ROUTE_PACKAGES_LIST,
                      CANONICAL_ROUTE_SEMANTIC,
                      CANONICAL_ROUTE_EMBEDDING,
                      CANONICAL_ROUTE_ORGS,
                      CANONICAL_ROUTE_AUDIT,
                      CANONICAL_ROUTE_AUDIT_VERIFY,
                      CANONICAL_ROUTE_FILES,
                  ] {
                      assert!(route.starts_with(CANONICAL_REGISTRY_PREFIX));
                  }
              }

          '''.replace("              ", "")
          text = text.replace(test_marker, route_test + test_marker, 1)
          routes.write_text(text)

          Path(".github/workflows/zz-reconcile-api-contract.yml").unlink()
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Commit the validated result without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          tested_head="$(git rev-parse HEAD)"
          git fetch origin feat/shared-auth-account-registry-api
          remote_head="$(git rev-parse origin/feat/shared-auth-account-registry-api)"
          if test "$tested_head" != "$remote_head"; then
            echo "The feature branch advanced during validation; refusing an untested overwrite." >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(DEN-2955): expose canonical account and registry APIs"
          git push origin HEAD:feat/shared-auth-account-registry-api
